# Blueprint do Render — ao conectar o repositório, ele lê este arquivo
services:
  - type: web
    name: coursefeedback
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_DEBUG
        value: "0"
